services:
    nginx:
        image: nginx:1.28.3-alpine
        restart: unless-stopped
        ports:
            - "127.0.0.1:${APP_PORT:-8080}:8080"
        depends_on:
            php:
                condition: service_healthy
        volumes:
            - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./public:/srv:ro
        networks: [app]
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/up || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 15s
        logging: &default-logging
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

    php:
        build: &php-build
            context: ./docker/php
            args:
                PUID: ${PUID:-1000}
                PGID: ${PGID:-1000}
        restart: unless-stopped
        env_file: &php-env-file
            - path: .env
              required: false
        volumes: &php-volumes
            - .:/var/www/html
        environment: &php-environment
            APP_ENV: ${APP_ENV:-local}
            DB_HOST: db
            DB_DATABASE: ${DB_DATABASE:-easymonitor}
            DB_USERNAME: ${DB_USERNAME:-easymonitor}
            DB_PASSWORD: ${DB_PASSWORD:-secret}
            REDIS_HOST: redis
            REDIS_PASSWORD: ${REDIS_PASSWORD:-}
        networks: [app]
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "php-fpm-healthcheck"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s
        logging: *default-logging

    worker:
        build: *php-build
        restart: unless-stopped
        command: ["php", "artisan", "horizon"]
        stop_grace_period: 1h
        env_file: *php-env-file
        volumes: *php-volumes
        environment: *php-environment
        networks: [app]
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "php", "artisan", "horizon:status"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        logging: *default-logging

    scheduler:
        build: *php-build
        restart: unless-stopped
        command: ["php", "artisan", "schedule:work"]
        stop_grace_period: 30s
        env_file: *php-env-file
        volumes: *php-volumes
        environment: *php-environment
        networks: [app]
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        logging: *default-logging

    db:
        image: timescale/timescaledb:2.26.0-pg18
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${DB_USERNAME:-easymonitor}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
            POSTGRES_DB: ${DB_DATABASE:-easymonitor}
        volumes:
            - db_data:/var/lib/postgresql/18/docker
            - ./docker/db/init.sh:/docker-entrypoint-initdb.d/999-init.sh:ro
        networks: [app]
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s
        logging: *default-logging

    redis:
        image: redis:7.4-alpine
        restart: unless-stopped
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD:-}
        command: >
            sh -c '
                if [ -n "$$REDIS_PASSWORD" ]; then
                    exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
                else
                    exec redis-server --appendonly yes
                fi
            '
        volumes:
            - redis_data:/data
        networks: [app]
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping; else redis-cli ping; fi',
                ]
            interval: 10s
            timeout: 5s
            retries: 10
        logging: *default-logging

    probe:
        build: ./probe-node
        restart: unless-stopped
        environment:
            NODE_ID: ${PROBE_NODE_ID:-local-node-1}
            REDIS_URL: ${PROBE_REDIS_URL:-redis://redis:6379/0}
            REDIS_PASSWORD: ${REDIS_PASSWORD:-}
            JWT_TOKEN: ${PROBE_JWT_TOKEN:-}
            DEFAULT_TIMEOUT: 30s
            BATCH_SIZE: 10
            MAX_CONCURRENCY: 10
            HEALTH_CHECK_PORT: 8080
        depends_on:
            redis:
                condition: service_healthy
        networks: [app]
        healthcheck:
            test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 5s
        logging: *default-logging

networks:
    app:

volumes:
    db_data:
    redis_data:
