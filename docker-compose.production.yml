# Production overrides for docker-compose.yml.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --build
#
# Or set COMPOSE_FILE in your shell / .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.production.yml
#
# Traefik must already be running and attached to the external network named
# by TRAEFIK_NETWORK (default: traefik).

services:
    nginx:
        ports: !reset []
        networks:
            - app
            - traefik
        labels:
            traefik.enable: "true"
            traefik.docker.network: "${TRAEFIK_NETWORK:-traefik}"
            traefik.http.routers.easymonitor.rule: "Host(`${APP_DOMAIN:?Set APP_DOMAIN in .env}`)"
            traefik.http.routers.easymonitor.entrypoints: "${TRAEFIK_ENTRYPOINT:-websecure}"
            traefik.http.routers.easymonitor.tls: "true"
            traefik.http.routers.easymonitor.tls.certresolver: "${TRAEFIK_CERTRESOLVER:-letsencrypt}"
            traefik.http.routers.easymonitor.service: "easymonitor"
            traefik.http.services.easymonitor.loadbalancer.server.port: "8080"
            traefik.http.middlewares.easymonitor-headers.headers.stsSeconds: "31536000"
            traefik.http.middlewares.easymonitor-headers.headers.stsIncludeSubdomains: "true"
            traefik.http.middlewares.easymonitor-headers.headers.contentTypeNosniff: "true"
            traefik.http.middlewares.easymonitor-headers.headers.frameDeny: "true"
            traefik.http.routers.easymonitor.middlewares: "easymonitor-headers"

    php:
        environment:
            APP_ENV: production
            APP_DEBUG: "false"

    worker:
        environment:
            APP_ENV: production
            APP_DEBUG: "false"

    scheduler:
        environment:
            APP_ENV: production
            APP_DEBUG: "false"

networks:
    traefik:
        external: true
        name: "${TRAEFIK_NETWORK:-traefik}"
